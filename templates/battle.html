<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Battle — Knight's Gauntlet</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="battle-page">
<div id="tooltip" class="tooltip" style="display:none"></div>

<div class="battle-layout">
  <div class="combatant monster-side">
    <h2 id="monster-name">Monster</h2>
    <div class="hp-bar-wrapper"><div id="monster-hp-bar" class="hp-bar hp-bar-enemy"></div></div>
    <p id="monster-hp-text"></p>
    <div id="monster-mana-wrap" class="hp-bar-wrapper" style="display:none">
      <div id="monster-mana-bar" class="mana-bar"></div>
    </div>
    <p id="monster-mana-text"></p>
    <div id="monster-effects" class="effects-list"></div>
    <div id="monster-stats" class="monster-stat-row"></div>
    <div id="monster-skills" class="monster-skills"></div>
  </div>

  <div class="battle-log-panel">
    <div id="battle-log" class="battle-log"></div>
  </div>

  <div class="combatant hero-side">
    <h2 id="hero-name">Knight</h2>
    <div class="hp-bar-wrapper"><div id="hero-hp-bar" class="hp-bar"></div></div>
    <p id="hero-hp-text"></p>
    <div id="hero-mana-wrap" class="hp-bar-wrapper" style="display:none">
      <div id="hero-mana-bar" class="mana-bar"></div>
    </div>
    <p id="hero-mana-text"></p>
    <div id="hero-effects" class="effects-list"></div>
    <div id="move-buttons" class="move-grid"></div>
  </div>
</div>

<script src="/js/game.js"></script>
<script src="/js/battle.js"></script>
</body>
</html>
