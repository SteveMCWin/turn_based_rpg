<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Items — Knight's Gauntlet</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="items-page">
  <div id="tooltip" class="tooltip" style="display:none"></div>
  <div class="items-layout">
    <div class="items-header">
      <a href="/map" class="btn btn-secondary">← Back to Map</a>
      <h2>Items</h2>
    </div>
    <p id="battle-warning" class="battle-warning hidden">You are in battle — items cannot be equipped or used right now.</p>
    <div class="items-columns">
      <div class="items-section">
        <h3>Equipped</h3>
        <div id="equipped-items" class="item-list"></div>
        <p id="equipped-empty" class="muted-text hidden">No items equipped.</p>
      </div>
      <div class="items-section">
        <h3>Inventory</h3>
        <div id="inventory-items" class="item-list"></div>
        <p id="inventory-empty" class="muted-text hidden">Inventory is empty.</p>
      </div>
    </div>
    <p id="items-error" class="error-text hidden"></p>
  </div>

  <script src="/js/game.js"></script>
  <script src="/js/items.js"></script>
</body>
</html>
